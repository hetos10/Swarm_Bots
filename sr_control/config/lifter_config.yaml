controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_controller:
      type: mecanum_drive_controller/MecanumDriveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


mecanum_controller:
  ros__parameters:
    front_left_wheel_command_joint_name: wheel_fl_joint
    front_right_wheel_command_joint_name: wheel_fr_joint
    rear_left_wheel_command_joint_name: wheel_bl_joint
    rear_right_wheel_command_joint_name: wheel_br_joint

    front_left_wheel_state_joint_name: wheel_fl_joint
    front_right_wheel_state_joint_name: wheel_fr_joint
    rear_left_wheel_state_joint_name: wheel_bl_joint
    rear_right_wheel_state_joint_name: wheel_br_joint

    wheel_separation_x: 0.44
    wheel_separation_y: 0.36

    kinematics:
      wheels_radius: 0.05
    odom_topic: "/mecanum_controller/odometry"
    open_loop: false
    enable_odom_tf: true
    publish_limited_velocity: true
    publish_wheel_data: true
    cmd_vel_timeout: 0.5
    #publish_limited_velocity: true
    #velocity_rolling_window_size: 10
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 2.0
    linear.x.min_velocity: -2.0
    linear.x.max_acceleration: 1.0
    linear.x.max_jerk: 0.0
    linear.x.min_jerk: 0.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    angular.z.max_acceleration: 1.0
    angular.z.min_acceleration: -1.0
    angular.z.max_jerk: 0.0
    angular.z.min_jerk: 0.0

arm_controller:
  ros__parameters:
    joints:
      - arm_joint_1
      - arm_joint_2

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: false
    open_loop_control: true