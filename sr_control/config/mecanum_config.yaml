mecanum_controller:
  wheel_radius: 0.05          # 5cm wheels
  chassis_length: 0.40        # 40cm chassis
  chassis_width: 0.40         # 40cm chassis
  max_wheel_velocity: 10.0    # rad/s
  update_rate: 50             # Hz
  debug: false

wheels:
  front_left:
    name: wheel_fl_joint
    type: continuous
  front_right:
    name: wheel_fr_joint
    type: continuous
  back_left:
    name: wheel_bl_joint
    type: continuous
  back_right:
    name: wheel_br_joint
    type: continuous
