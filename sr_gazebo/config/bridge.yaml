# ==========================================
# LIFTER 1 (Wheels + Arm)
# ==========================================

# Wheels
- ros_type_name: "std_msgs/msg/Float64"
  ros_topic_name: "/lifter1/cmd_wheel_fl"
  gz_topic_name: "/lifter1/cmd_wheel_fl"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
  

- ros_type_name: "std_msgs/msg/Float64"
  ros_topic_name: "/lifter1/cmd_wheel_fr"
  gz_topic_name: "/lifter1/cmd_wheel_fr"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
  

- ros_type_name: "std_msgs/msg/Float64"
  ros_topic_name: "/lifter1/cmd_wheel_bl"
  gz_topic_name: "/lifter1/cmd_wheel_bl"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
  

- ros_type_name: "std_msgs/msg/Float64"
  ros_topic_name: "/lifter1/cmd_wheel_br"
  gz_topic_name: "/lifter1/cmd_wheel_br"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
  

# Arm Joints (Shoulder and Elbow)
- ros_type_name: "std_msgs/msg/Float64"
  ros_topic_name: "/lifter1/cmd_shoulder"
  gz_topic_name: "/lifter1/cmd_shoulder"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
  

- ros_type_name: "std_msgs/msg/Float64"
  ros_topic_name: "/lifter1/cmd_elbow"
  gz_topic_name: "/lifter1/cmd_elbow"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
  

# Lifter Odometry
- ros_type_name: "nav_msgs/msg/Odometry"
  ros_topic_name: "/lifter1/odom"
  gz_topic_name: "/lifter1/odom"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
  

