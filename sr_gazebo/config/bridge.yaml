# Clock Sync (Essential for Odom to not be empty)
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "ignition.msgs.Clock"
  direction: GZ_TO_ROS

# Odometry (From Gazebo to ROS)
- ros_topic_name: "/lifter1/odom"
  gz_topic_name: "/lifter1/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "ignition.msgs.Odometry"
  direction: GZ_TO_ROS

# Arm Joint Commands
- ros_topic_name: "/model/lifter1/joint/arm_joint_1/cmd_vel"
  gz_topic_name: "/model/lifter1/joint/arm_joint_1/cmd_vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

